[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hentai-studio"
version = "0.7.0"
description = "Standalone local training project and job manager"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<1",
  "starlette>=1.10,<2",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
llm = ["torch>=2.4", "transformers>=4.46,<5", "accelerate>=1,<2"]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[project.scripts]
hentai-studio = "hentai_studio.cli:main"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
hentai_studio = ["dashboard_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
